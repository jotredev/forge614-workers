name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  # Comprueba en los dos sistemas publicados que código, tipos e instalador siguen siendo válidos.
  unix:
    name: Unix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Descarga el repositorio que se va a comprobar.
      - uses: actions/checkout@v4
      # Fija Bun para que la CI no cambie de entorno sin una revisión del repositorio.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Instala exactamente el archivo de bloqueo y evita scripts de dependencias.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Instala un Engines real y fijado para que las pruebas de integración no dependan del PATH del corredor.
      - name: Install Forge614 Engines (pinned; the tests use the real binary)
        shell: bash
        env:
          ENGINES_VERSION: "1.17.0"
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   combo=linux-x64 ;;
            Linux-ARM64) combo=linux-arm64 ;;
            macOS-ARM64) combo=darwin-arm64 ;;
            macOS-X64)   combo=darwin-x64 ;;
            *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          name="forge614-engines-${ENGINES_VERSION}-${combo}"
          base="https://github.com/jotredev/forge614-engines/releases/download/v${ENGINES_VERSION}"
          dir="$RUNNER_TEMP/engines"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error --output "$dir/$name.tar.gz" "$base/$name.tar.gz"
          curl --fail --location --silent --show-error --output "$dir/$name.tar.gz.sha256" "$base/$name.tar.gz.sha256"
          (cd "$dir" && shasum -a 256 -c "$name.tar.gz.sha256")
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
          bin="$dir/$name/forge614-engines"
          test -x "$bin"
          # A wrong or too-old Engines must fail here with a clear message, not as a pile of confusing test failures.
          capabilities="$("$bin" capabilities --agent claude-code)"
          grep -Eq '"supportsReadOnly": *true' <<< "$capabilities" \
            || { echo "Engines ${ENGINES_VERSION} does not guarantee the read-only lock" >&2; exit 1; }
          echo "FORGE614_ENGINES_BIN=$bin" >> "$GITHUB_ENV"
      # Corre toda la suite contra el Engines verificado de arriba.
      - run: bun test
      # Revisa los tipos sin generar archivos.
      - run: bun run typecheck
      # Rechaza espacios y marcadores de conflicto que Git detecta en el diff.
      - run: git diff --check
      # Valida la sintaxis del instalador sin ejecutarlo.
      - run: bash -n scripts/install.sh
