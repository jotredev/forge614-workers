name: verify-platforms
on:
  pull_request:
  push: { branches: [main] }
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with: { bun-version: "1.4.2" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22.19.0" }
      - run: bun install --frozen-lockfile
      - name: Create isolated test homes on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          forge_home="$RUNNER_TEMP/forge614-home"
          forge614_home="$forge_home/.forge614"
          mkdir -p "$forge_home" "$forge614_home"
          printf 'HOME=%s\nFORGE614_HOME=%s\n' "$forge_home" "$forge614_home" >> "$GITHUB_ENV"
      - name: Create isolated test homes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $forgeHome = Join-Path $env:RUNNER_TEMP "forge614-home"
          $forge614Home = Join-Path $forgeHome ".forge614"
          New-Item -ItemType Directory -Force -Path $forgeHome, $forge614Home | Out-Null
          "HOME=$forgeHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE614_HOME=$forge614Home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile portable Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem test/fixtures/*.js | ForEach-Object {
            $output = [System.IO.Path]::ChangeExtension($_.FullName, ".exe")
            bun build --compile --target=bun-windows-x64 $_.FullName --outfile $output
            if ($LASTEXITCODE -ne 0) { throw "Could not compile fixture $($_.Name)" }
          }
      - name: Build real Windows installer end-to-end assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-e2e | Out-Null
          bun build ./src/main.ts --compile --target=bun-windows-x64 --outfile dist/windows-e2e/forge614-workers-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not build Workers" }
          bun build ./test/fixtures/fake-engines-windows.ts --compile --target=bun-windows-x64 --outfile dist/windows-e2e/forge614-engines.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not build fake Engines" }
          $targetRoot = Join-Path $env:RUNNER_TEMP "forge614-workers-1.1.1"
          $targetSource = Join-Path $targetRoot "src"
          New-Item -ItemType Directory -Force -Path $targetSource | Out-Null
          Copy-Item -Path "src/*" -Destination $targetSource -Recurse -Force
          Copy-Item -Path package.json -Destination (Join-Path $targetRoot "package.json") -Force
          $targetPackagePath = Join-Path $targetRoot "package.json"
          $targetPackage = Get-Content $targetPackagePath -Raw | ConvertFrom-Json
          $targetPackage.version = "1.1.1"
          $targetPackageJson = $targetPackage | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($targetPackagePath, $targetPackageJson, [System.Text.UTF8Encoding]::new($false))
          bun build (Join-Path $targetSource "main.ts") --compile --target=bun-windows-x64 --outfile dist/windows-e2e/forge614-workers-1.1.1.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not build target Workers" }
      - run: bun run verify
      - run: bun run build:target
        env: { FORGE614_TARGET: "${{ matrix.target }}" }
      - run: bun run smoke:target
        env: { FORGE614_TARGET: "${{ matrix.target }}" }
      - run: git diff --check
